<!doctype html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{error.page.title}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
    <body class="bg-light min-vh-100 d-flex flex-column">
        <div th:replace="~{fragments/header :: header}"></div>

        <main class="container" style="max-width: 760px">
            <div class="card shadow-sm p-4">
                <h1 class="h3" th:text="#{error.page.title}"></h1>
                <p class="mb-4" th:text="#{${errorKey}}"></p>
                <a class="btn btn-outline-dark align-self-start" th:href="@{/}" th:text="#{error.page.home}"></a>
            </div>
        </main>

        <div th:replace="~{fragments/footer :: footer}"></div>
    </body>
</html>
