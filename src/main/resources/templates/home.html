<!doctype html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{home.title}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
    <body class="bg-light min-vh-100 d-flex flex-column">
        <div th:replace="~{fragments/header :: header}"></div>

        <main class="container pb-4">
            <h1 class="h2 fw-semibold mb-4" th:text="#{home.title}"></h1>

            <div th:if="${#lists.isEmpty(votings)}" class="border rounded bg-white p-4 text-secondary" th:text="#{home.empty}"></div>

            <div class="row g-3" th:unless="${#lists.isEmpty(votings)}">
                <div class="col-md-6" th:each="voting : ${votings}">
                    <a class="card h-100 text-decoration-none text-body shadow-sm"
                       th:href="${voting.status.name() == 'ACTIVE'} ? @{/votings/{id}/vote(id=${voting.id})} : (${voting.status.name() == 'STOPPED'} ? @{/votings/{id}/results(id=${voting.id})} : @{/votings/{id}(id=${voting.id})})">
                        <div class="card-body">
                            <div class="d-flex flex-wrap justify-content-between align-items-start gap-2 mb-3">
                                <h3 class="h5 mb-0" th:text="${voting.title}"></h3>
                                <span th:replace="~{fragments/status :: badge(${voting.status})}"></span>
                            </div>
                            <p class="text-secondary small mb-3" th:text="#{home.owner(${voting.ownerName})}"></p>
                            <span class="fw-semibold text-secondary"
                                  th:text="${voting.status.name() == 'ACTIVE'} ? #{home.open.vote} : (${voting.status.name() == 'DRAFT'} ? #{home.open.draft} : #{home.open.results})"></span>
                        </div>
                    </a>
                </div>
            </div>
        </main>

        <div th:replace="~{fragments/footer :: footer}"></div>
    </body>
</html>
