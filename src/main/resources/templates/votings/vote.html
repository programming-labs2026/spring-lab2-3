<!doctype html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{vote.page.title(${voting.title})}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
    <body class="bg-light min-vh-100 d-flex flex-column">
        <div th:replace="~{fragments/header :: header}"></div>

        <main class="container pb-4" style="max-width: 760px">
            <a class="d-inline-block mb-3 link-secondary" th:href="@{/}" th:text="#{details.back}"></a>

            <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4">
                <div>
                    <div class="mb-2">
                        <span th:replace="~{fragments/status :: badge(${voting.status})}"></span>
                    </div>
                    <h1 class="h2 mb-1" th:text="${voting.title}"></h1>
                    <p class="text-secondary mb-0" th:text="#{home.owner(${voting.ownerName})}"></p>
                </div>
                <div class="d-flex gap-2">
                    <a class="btn btn-outline-secondary" th:href="@{/votings/{id}(id=${voting.id})}" th:text="#{vote.details}"></a>
                    <a class="btn btn-outline-dark" th:href="@{/votings/{id}/results(id=${voting.id})}" th:text="#{details.results}"></a>
                </div>
            </div>

            <div class="alert alert-success" th:if="${messageKey}" th:text="#{${messageKey}}"></div>

            <section class="card border-0 shadow-sm" th:if="${voting.status.name() == 'ACTIVE'}">
                <div class="card-body p-4">
                    <h2 class="h4 mb-4" th:text="#{details.vote.title}"></h2>

                    <form method="post" th:action="@{/votings/{id}/vote(id=${voting.id})}" th:object="${castVoteRequest}">
                        <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
                            <div th:each="error : ${#fields.globalErrors()}" th:text="${error}"></div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold" for="userId"
                                   th:text="#{details.vote.step.user}"></label>
                            <select id="userId" class="form-select" th:field="*{userId}">
                                <option value="" th:text="#{common.select.user}"></option>
                                <option th:each="user : ${users}" th:value="${user.id}" th:text="${user.username}"></option>
                            </select>
                            <div class="text-danger small" th:errors="*{userId}"></div>
                        </div>

                        <fieldset class="mb-4">
                            <legend class="fs-6 fw-semibold mb-3"
                                    th:text="#{details.vote.step.candidate}"></legend>
                            <div class="form-check border rounded p-3 ps-5 mb-2 bg-white"
                                 th:each="candidate : ${voting.candidates}">
                                <input class="form-check-input" type="radio" th:field="*{candidateId}"
                                       th:value="${candidate.id}">
                                <label class="form-check-label d-block fw-medium"
                                       th:for="${#ids.prev('candidateId')}" th:text="${candidate.name}"></label>
                            </div>
                            <div class="text-danger small" th:errors="*{candidateId}"></div>
                        </fieldset>

                        <button class="btn btn-dark" type="submit" th:text="#{details.vote.submit}"></button>
                    </form>
                </div>
            </section>

            <div class="alert alert-secondary" th:if="${voting.status.name() == 'DRAFT'}" th:text="#{vote.not-started}"></div>

            <div class="card border-0 shadow-sm" th:if="${voting.status.name() == 'STOPPED'}">
                <div class="card-body p-4">
                    <p class="mb-3" th:text="#{vote.stopped}"></p>
                    <a class="btn btn-dark" th:href="@{/votings/{id}/results(id=${voting.id})}" th:text="#{details.results}"></a>
                </div>
            </div>
        </main>

        <div th:replace="~{fragments/footer :: footer}"></div>
    </body>
</html>
